version = "2.0.6"
description = "Р‘РµР·РѕРїР°СЃРЅС‹Р№ С‚СЂР°РЅР·Р°РєС†РёРѕРЅРЅС‹Р№ РїРѕСЃС‚РєРѕРЅС„РёРіСѓСЂР°С‚РѕСЂ LucX"
requires-python = ">=3.11"
